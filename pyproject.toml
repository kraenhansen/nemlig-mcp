[project]
name = "nemlig-mcp"
version = "0.1.0"
description = "MCP server exposing nemlig.com grocery shopping as tools, built on nemlig-cli"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0.0",
    # Needs the library-friendly fixes merged in eisbaw/nemlig_cli#3 (tty-gated
    # spinner, optional deps as extras). Not on PyPI, so installed from git;
    # uv.lock pins the exact commit.
    "nemlig-cli @ git+https://github.com/eisbaw/nemlig_cli.git@main",
]

[project.scripts]
nemlig-mcp = "nemlig_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

# To develop against a local checkout of the CLI instead of the pinned commit,
# uncomment this and run `uv sync`:
#
# [tool.uv.sources]
# nemlig-cli = { path = "../nemlig_cli", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemlig_mcp"]

# nemlig-cli is installed from a git URL (it is not on PyPI), which hatchling
# treats as a direct reference and rejects by default.
[tool.hatch.metadata]
allow-direct-references = true
