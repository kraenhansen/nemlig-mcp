[project]
name = "nemlig-mcp"
version = "0.1.0"
description = "MCP server exposing nemlig.com grocery shopping as tools, built on nemlig-cli"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0.0",
    "nemlig-cli",
]

[project.scripts]
nemlig-mcp = "nemlig_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

# Local development: use the sibling checkout of the CLI rather than the
# published package, so changes there are picked up immediately.
# For a standalone install, drop this section and depend on the git URL.
[tool.uv.sources]
nemlig-cli = { path = "../nemlig_cli", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemlig_mcp"]
